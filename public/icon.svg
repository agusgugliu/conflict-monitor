<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Globe outline -->
  <circle cx="16" cy="16" r="12.5" stroke="#e05252" stroke-width="1.5"/>
  <!-- Meridian line -->
  <ellipse cx="16" cy="16" rx="6.5" ry="12.5" stroke="#e05252" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Equator -->
  <line x1="3.5" y1="16" x2="28.5" y2="16" stroke="#e05252" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Tropic lines -->
  <path d="M5.5 11 Q16 9.5 26.5 11" stroke="#e05252" stroke-width="0.7" stroke-opacity="0.35" fill="none"/>
  <path d="M5.5 21 Q16 22.5 26.5 21" stroke="#e05252" stroke-width="0.7" stroke-opacity="0.35" fill="none"/>
  <!-- Crosshair ticks (top, bottom, left, right) -->
  <line x1="16" y1="1" x2="16" y2="5.5" stroke="#e05252" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="26.5" x2="16" y2="31" stroke="#e05252" stroke-width="2" stroke-linecap="round"/>
  <line x1="1" y1="16" x2="5.5" y2="16" stroke="#e05252" stroke-width="2" stroke-linecap="round"/>
  <line x1="26.5" y1="16" x2="31" y2="16" stroke="#e05252" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#e05252"/>
</svg>
